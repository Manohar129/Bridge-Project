<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="admindash.css">
</head>
<body>
<div class="navbar">
    <div class="nav-left">
        <img src="../Time management project/img/oppty.png" alt="Oppty Logo">
        <h3>Oppty Admin Portal</h3>
    </div>

   
    <div class="nav-right">
        <span class="user">admin@oppty.in</span>
        <button class="logout" onclick="window.location.href='admin.html'">Logout</button>
    </div>
</div>

<div class="main">

    
    <div class="left">

      
        <div class="card">
            <h4>Add New User</h4>
            <input type="email" placeholder="Email (@oppty.in)">
            <input type="text" placeholder="Username">
            <input type="password" placeholder="Password">
            <button class="add-btn" onclick="addUser()">Add User</button>
            <button class="edit-btn" onclick="editUser(this)">Edit</button>
            <button class="delete-btn" onclick="deleteUser(this)">Delete</button>
        </div>

        <div class="card">
            <h4>User Management</h4>

            <table>
                <tr>
                    <th>Email</th>
                    <th>Username</th>
                    <th>Status</th>
                </tr>

                <tr>
                    <td>admin@oppty.in</td>
                    <td>Admin</td>
                    <td class="green">Online</td>
                </tr>

                <tr>
                    <td>user@oppty.in</td>
                    <td>User1</td>
                    <td class="red">Offline</td>
                </tr>
            </table>
        </div>

    </div>

    <div class="right">

        <div class="stat">
            <p>Total Users</p>
            <h1>3</h1>
        </div>

        <div class="stat">
            <p>Active Users</p>
            <h1>2</h1>
        </div>

        <div class="stat">
            <p>Offline Users</p>
            <h1>1</h1>
        </div>

    </div>

</div>
<script src="../Time management project/admindash.js"></script>

</body>
</html>
