<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>

    <link rel="stylesheet" href="../admin/loginAD.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="page">
    <div class="login-card">
        <h2>Admin Login</h2>
        <p class="subtitle">Administrative Access</p>

        <div class="input-box">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="adminId" placeholder="admin@oppty.in">
        </div>

        <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="Password">
            <i class="fa-solid fa-eye eye" id="eye"></i>
        </div>

        <p class="error" id="errorMsg"></p>

        <button onclick="validate()">Login to Admin Panel</button>
    </div>
</div>

<script src="../admin/loginAD.js"></script>
</body>
</html>
