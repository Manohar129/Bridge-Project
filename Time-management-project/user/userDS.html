<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard & Monitoring</title>
    <link rel="stylesheet" href="../user/userDS.css">
</head>
<body>

    <div class="navbar">
        <div class="nav-left">
            <h3 style="margin:0;">Dashboard: <span id="currentUserName" style="color: #ffd700;">Loading...</span></h3>
        </div>
        <div class="nav-right">
            <button class="logout" onclick="logout()">Logout</button>
        </div> 
    </div>

    <div class="main-content">
        <div class="card monitoring-section">
            <h4>Live Team Monitoring</h4>
            <table border="1" style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead>
                    <tr style="background-color: #f4f4f4;">
                        <th>Username</th>
                        <th>Status</th>
                        <th>Live Timer</th> 
                        <th>Lunch</th>
                        <th>Regular</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="userTable"></tbody>
            </table>
        </div>

        <div class="container personal-dashboard">
            <h2>Welcome back!</h2>

            <div class="actions">
                <button class="btn-lunch" onclick="startLunch()">Start Lunch Break</button>
                <button class="btn-regular" onclick="startRegular()">Start Regular Break</button>
                <button class="btn-end" onclick="endBreak()">End Break</button>
            </div>

            <div class="timer-display">
                <p><b>Your Current Break Time:</b> <span id="breakTime" style="font-size: 1.5rem; color: #ff0000;">00:00</span></p>
            </div>

            <div class="cards">
                <div class="stat-card">
                    <p>Lunch Breaks</p>
                    <h3 id="lunchCount">0</h3>
                </div>
                <div class="stat-card">
                    <p>Regular Breaks</p>
                    <h3 id="regularCount">0</h3>
                </div>
                <div class="stat-card">
                    <p>Total Team on Break</p>
                    <h3 id="teamBreak">0</h3>
                </div>
            </div>

            <div class="section">
                <h4>Status Summary</h4>
                <p id="onBreak">No one on break</p>
            </div>
        </div>
    </div>

    <script src="../user/userDS.js"></script>
</body>
</html>
