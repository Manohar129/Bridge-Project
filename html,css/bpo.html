<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Oppty-BPO</title>
    <style>
/* ================= HEADER V2 ================= */
.header-v2 {
    position: sticky;
    top: 0;
    z-index: 999;
    background: #ffffff;
    box-shadow: 0 8px 30px rgba(0,0,0,0.06);
}

.header-inner {
    max-width: 1400px;
    margin: auto;
    padding: 16px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

/* BRAND */
.brand-area {
    display: flex;
    align-items: center;
    gap: 14px;
}

.brand-accent {
    width: 6px;
    height: 38px;
    background: linear-gradient(180deg, #ff6600, #ff944d);
    border-radius: 10px;
}

.brand-area img {
    height: 42px;
}

/* PILL NAV */
.pill-nav {
    background: #f4f6f9;
    padding: 10px 18px;
    border-radius: 50px;
}

.pill-nav ul {
    display: flex;
    align-items: center;
    gap: 26px;
    list-style: none;
}

.pill-nav a {
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    color: #0b1c2d;
    padding: 8px 14px;
    border-radius: 30px;
    transition: 0.3s ease;
}

.pill-nav a:hover,
.pill-nav a.active {
    background: #ffffff;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    color: #ff6600;
}

/* MEGA MENU */
.has-mega {
    position: relative;
}

.has-mega:hover .mega-menu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.mega-menu {
    position: absolute;
    top: 130%;
    left: -120px;
    background: #ffffff;
    padding: 35px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 40px;
    border-radius: 20px;
    box-shadow: 0 35px 70px rgba(0,0,0,0.15);
    opacity: 0;
    visibility: hidden;
    transform: translateY(20px);
    transition: all 0.35s ease;
    min-width: 480px;
}

.mega-column h4 {
    color: #ff6600;
    margin-bottom: 14px;
}

.mega-column a {
    display: block;
    color: #333;
    margin-bottom: 10px;
    font-size: 14px;
}

.mega-column a:hover {
    color: #ff6600;
}

/* CTA */
.header-btn {
    background: linear-gradient(135deg, #ff6600, #ff944d);
    color: #ffffff;
    padding: 12px 28px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: 0.3s ease;
}

.header-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(255,102,0,0.4);
}

/* HAMBURGER */
.hamburger {
    display: none;
    flex-direction: column;
    gap: 6px;
    cursor: pointer;
}

.hamburger span {
    width: 26px;
    height: 2px;
    background: #0b1c2d;
}

/* MOBILE */
@media (max-width: 992px) {
    .pill-nav {
        position: fixed;
        top: 75px;
        right: -100%;
        width: 100%;
        height: calc(100vh - 75px);
        background: #ffffff;
        border-radius: 0;
        padding: 40px 25px;
        transition: 0.4s ease;
    }

    .pill-nav.open {
        right: 0;
    }

    .pill-nav ul {
        flex-direction: column;
        align-items: flex-start;
        gap: 22px;
    }

    .mega-menu {
        position: static;
        opacity: 1;
        visibility: visible;
        transform: none;
        box-shadow: none;
        min-width: 100%;
        padding: 20px 0;
        grid-template-columns: 1fr;
    }

    .header-action {
        display: none;
    }

    .hamburger {
        display: flex;
    }
}


    </style>
<header class="bpo-header" id="bpoHeader">
    <div class="bpo-header-inner">

        <!-- LOGO -->
        <div class="bpo-logo">
            <a href="../Oppty-BPO-/html/home.html">
                <img src="../img/322343.png" alt="Oppty BPO">
            </a>
        </div>

        <!-- NAVIGATION -->
        <nav class="bpo-nav" id="bpoNav">
            <ul>
                <li><a href="../Oppty-BPO-/html/home.html" class="active">Home</a></li>
                <li><a href="../Oppty-BPO-/html/About.html">About Us</a></li>

                <!-- MEGA MENU -->
                <li class="bpo-mega">
                    <a href="#services">What We Do</a>

                    <div class="bpo-mega-menu">
                        <div class="bpo-mega-col">
                            <h4>Operations</h4>
                            <a href="../Oppty-BPO-/what we do html/bms.html">Break Management System</a>
                            <a href="../Oppty-BPO-/what we do html/L&s.html">Logistics & Supply Chain</a>
                            <a href="../Oppty-BPO-/what we do html/finance.html">Finance & Accounting</a>
                        </div>

                        <div class="bpo-mega-col">
                            <h4>Digital Enablement</h4>
                            <a href="../Oppty-BPO-/what we do html/ui&ux.html">UI / UX Design</a>
                            <a href="../Oppty-BPO-/what we do html/Ai.html">AI Automation</a>
                            <a href="../Oppty-BPO-/what we do html/it.html">IT Consultancy</a>
                        </div>
                    </div>
                </li>

                <li><a href="../Oppty-BPO-/html/Insights.html">Insights</a></li>
                <li><a href="../Oppty-BPO-/html/careers.html">Careers</a></li>
            </ul>
        </nav>

        <!-- CTA -->
        <div class="bpo-header-cta">
            <a href="../Oppty-BPO-/html/contact.html" class="bpo-btn">
                Talk to Our Experts
            </a>
        </div>

        <!-- MOBILE TOGGLE -->
        <div class="bpo-toggle" id="bpoToggle">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>
</header>



    
<script>
const burger = document.querySelector(".hamburger");
const nav = document.querySelector(".pill-nav");

burger.addEventListener("click", () => {
    nav.classList.toggle("open");
});
</script>


</body>
</html>
