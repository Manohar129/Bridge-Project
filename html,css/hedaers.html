<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
    /* --- HEADER RESET & FONTS --- */
.command-header {
    position: fixed;
    top: 25px;
    left: 0;
    width: 100%;
    z-index: 10000;
    display: flex;
    justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
}

.header-island-container {
    display: flex;
    gap: 12px;
    align-items: center;
}

/* THE ISLAND BASE SYSTEM */
.header-island {
    background: rgba(15, 18, 23, 0.85); /* Matches Bento Box Background */
    backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 24px; /* Hierarchical Radius for Navigation */
    padding: 10px 22px;
    display: flex;
    align-items: center;
    
    /* DUAL SHADOW SYSTEM: Matching your Footer Boxes */
    box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.4),
        inset 0 1px 1px rgba(255, 255, 255, 0.05);
    
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

/* LOGO BOX */
.logo-island img { height: 35px; filter: brightness(1.1); }

/* NAVIGATION LINKS */
.nav-links { display: flex; list-style: none; gap: 20px; margin: 0; padding: 0; }
.nav-links a {
    text-decoration: none;
    color: rgba(255, 255, 255, 0.7);
    font-size: 14px;
    font-weight: 600;
    transition: 0.3s;
}
.nav-links a:hover { color: #e55f14; }

/* MEGA BENTO DROPDOWN */
.dropdown-trigger { position: relative; }
.mega-bento {
    position: absolute;
    top: calc(100% + 15px);
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    width: 480px;
    background: #0f1217;
    border: 1px solid #e55f14;
    border-radius: 30px; /* Hierarchical Radius: 30px to match Footer */
    padding: 30px;
    opacity: 0;
    visibility: hidden;
    transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
    box-shadow: 0 30px 60px rgba(0,0,0,0.6);
}

.dropdown-trigger:hover .mega-bento {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
}

.mega-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
.mega-col h3 { color: #e55f14; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 15px; }
.mega-col a { display: block; margin-bottom: 12px; color: #fff; text-decoration: none; font-size: 14px; opacity: 0.8; transition: 0.2s; }
.mega-col a:hover { color: #e55f14; opacity: 1; }

/* ACTION PILL */
.nav-cta-pill {
    background: linear-gradient(135deg, #e55f14, #ff8c42);
    color: #fff !important;
    padding: 8px 20px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 12px;
    text-decoration: none;
    box-shadow: 0 10px 20px rgba(229, 95, 20, 0.2);
}

/* KINETIC DOT ALERT */
.dot-alert {
    width: 6px; height: 6px; background: #e55f14; border-radius: 50%;
    display: inline-block; margin-left: 5px; box-shadow: 0 0 10px #e55f14;
    animation: pulseHeader 2s infinite;
}

@keyframes pulseHeader { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.6); opacity: 0.5; } }
    </style>
  </head>
  <body>
<header class="command-header">
    <div class="header-island-container">
        <div class="header-island logo-island">
            <a href="../Oppty-BPO-/html/home.html">
                <img src="../html,css/" alt="Oppty Logo">
            </a>
        </div>

        <nav class="header-island menu-island">
            <ul class="nav-links">
                <li><a href="../Oppty-BPO-/html/home.html">Home</a></li>
                <li class="dropdown-trigger">
                    <a href="#services">What We Do <span class="dot-alert"></span></a>
                    <div class="mega-bento">
                        <div class="mega-grid">
                            <div class="mega-col">
                                <h3>Operations</h3>
                                <a href="../Oppty-BPO-/what we do html/bms.html">Break Management</a>
                                <a href="../Oppty-BPO-/what we do html/L&s.html">Logistics & Supply</a>
                                <a href="../Oppty-BPO-/what we do html/finance.html">Finance & Accounting</a>
                            </div>
                            <div class="mega-col">
                                <h3>Digital</h3>
                                <a href="../Oppty-BPO-/what we do html/ui&ux.html">UI/UX Design</a>
                                <a href="../Oppty-BPO-/what we do html/Ai.html">AI Automation</a>
                                <a href="../Oppty-BPO-/what we do html/it.html">IT Consultancy</a>
                            </div>
                        </div>
                    </div>
                </li>
                <li><a href="../Oppty-BPO-/html/careers.html">Careers</a></li>
            </ul>
        </nav>

        <div class="header-island action-island">
            <a href="../Oppty-BPO-/html/contact.html" class="nav-cta-pill">Contact Us</a>
        </div>
    </div>
</header>
<script>
    window.addEventListener('scroll', () => {
    const islands = document.querySelectorAll('.header-island');
    if (window.scrollY > 50) {
        islands.forEach(island => {
            island.style.padding = "8px 18px";
            island.style.background = "rgba(10, 10, 10, 0.95)";
        });
    } else {
        islands.forEach(island => {
            island.style.padding = "10px 22px";
            island.style.background = "rgba(15, 18, 23, 0.85)";
        });
    }
});
</script>
  </body>
</html>
